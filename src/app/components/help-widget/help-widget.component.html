<!-- Help FAB Button -->
<ion-button
  class="help-fab"
  fill="solid"
  shape="round"
  size="small"
  (click)="openHelp()"
  title="Help"
>
  <ion-icon name="help-circle" slot="icon-only"></ion-icon>
</ion-button>

<!-- Help Modal -->
<ion-modal [isOpen]="isHelpOpen" (didDismiss)="closeHelp()" class="help-modal">
  <ng-template>
    <ion-header>
      <ion-toolbar color="dark">
        <ion-title>{{ pageTitle }}</ion-title>
        <ion-buttons slot="end">
          <ion-button (click)="closeHelp()">
            <ion-icon name="close" slot="icon-only"></ion-icon>
          </ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>
    <ion-content class="ion-padding">
      <ion-list lines="full" class="help-list">
        <ion-item *ngFor="let tip of tips" class="help-item">
          <ion-icon
            [name]="tip.icon || 'information-circle'"
            slot="start"
            color="primary"
          ></ion-icon>
          <ion-label>
            <h3>{{ tip.title }}</h3>
            <p>{{ tip.description }}</p>
          </ion-label>
        </ion-item>
      </ion-list>
    </ion-content>
  </ng-template>
</ion-modal>
